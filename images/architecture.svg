<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1000" height="260" fill="#ffffff"/>

  <!-- Producer -->
  <rect x="20" y="90" width="140" height="80" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="90" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Producer</text>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#444">Python</text>
  <text x="90" y="155" text-anchor="middle" font-size="11" fill="#444">orders + payments</text>

  <line x1="160" y1="130" x2="215" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka -->
  <rect x="220" y="80" width="150" height="100" rx="10" fill="#fdece8" stroke="#ea4335" stroke-width="2"/>
  <text x="295" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Kafka</text>
  <text x="295" y="130" text-anchor="middle" font-size="11" fill="#444">stream_orders</text>
  <text x="295" y="146" text-anchor="middle" font-size="11" fill="#444">stream_payments</text>
  <text x="295" y="164" text-anchor="middle" font-size="10" fill="#888">localhost:9092</text>

  <line x1="370" y1="130" x2="425" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Spark -->
  <rect x="430" y="70" width="170" height="120" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="515" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Spark</text>
  <text x="515" y="114" text-anchor="middle" font-size="11" fill="#444">Structured Streaming</text>
  <text x="515" y="134" text-anchor="middle" font-size="11" fill="#444">stream-to-stream join</text>
  <text x="515" y="150" text-anchor="middle" font-size="11" fill="#444">watermark: 5s</text>
  <text x="515" y="170" text-anchor="middle" font-size="11" fill="#444">fraud detection</text>

  <line x1="600" y1="130" x2="655" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HDFS -->
  <rect x="660" y="80" width="150" height="100" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="735" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">HDFS</text>
  <text x="735" y="132" text-anchor="middle" font-size="11" fill="#444">Parquet files</text>
  <text x="735" y="150" text-anchor="middle" font-size="11" fill="#444">+ checkpoints</text>

  <line x1="810" y1="130" x2="865" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hive -->
  <rect x="870" y="90" width="110" height="80" rx="10" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/>
  <text x="925" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Hive</text>
  <text x="925" y="140" text-anchor="middle" font-size="11" fill="#444">external table</text>
  <text x="925" y="155" text-anchor="middle" font-size="11" fill="#444">SQL analytics</text>

  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#888">micro-batch trigger: 10s</text>
</svg>
